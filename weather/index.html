<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather · Compton, CA</title>
<style>
  :root {
    --bg: transparent;
    --card: #f1f1ef;
    --ink: #37352f;
    --muted: #787774;
    --line: #e3e2e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card: #252525;
      --ink: #e6e6e4;
      --muted: #9b9a97;
      --line: #373737;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    padding: 6px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 18px 20px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }
  .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
  }
  .now { display: flex; align-items: center; gap: 14px; }
  .icon { font-size: 40px; line-height: 1; }
  .temp { font-size: 42px; font-weight: 600; line-height: 1; }
  .cond { font-size: 15px; margin-top: 4px; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .days {
    display: flex;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }
  .day { flex: 1; text-align: center; font-size: 13px; }
  .day b { display: block; font-weight: 600; margin-bottom: 4px; }
  .day .di { font-size: 20px; display: block; margin-bottom: 4px; }
  .day span { color: var(--muted); }
  .err { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="label">Weather · Compton, CA</div>
  <div class="now">
    <div class="icon" id="icon">·</div>
    <div>
      <div class="temp" id="temp">--°</div>
      <div class="cond" id="cond">Loading…</div>
    </div>
  </div>
  <div class="sub" id="sub"></div>
  <div class="days" id="days"></div>
</div>
<script>
  const URL_API = "https://api.open-meteo.com/v1/forecast?latitude=33.8958&longitude=-118.2201" +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,is_day" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FLos_Angeles&forecast_days=5";

  // WMO weather codes -> [label, day icon, night icon]
  const CODES = {
    0: ["Clear", "☀️", "🌙"], 1: ["Mostly clear", "🌤️", "🌙"], 2: ["Partly cloudy", "⛅", "☁️"],
    3: ["Overcast", "☁️", "☁️"], 45: ["Fog", "🌫️", "🌫️"], 48: ["Fog", "🌫️", "🌫️"],
    51: ["Light drizzle", "🌦️", "🌧️"], 53: ["Drizzle", "🌦️", "🌧️"], 55: ["Heavy drizzle", "🌧️", "🌧️"],
    61: ["Light rain", "🌦️", "🌧️"], 63: ["Rain", "🌧️", "🌧️"], 65: ["Heavy rain", "🌧️", "🌧️"],
    71: ["Light snow", "🌨️", "🌨️"], 73: ["Snow", "🌨️", "🌨️"], 75: ["Heavy snow", "❄️", "❄️"],
    80: ["Showers", "🌦️", "🌧️"], 81: ["Showers", "🌧️", "🌧️"], 82: ["Heavy showers", "⛈️", "⛈️"],
    95: ["Thunderstorm", "⛈️", "⛈️"], 96: ["Thunderstorm", "⛈️", "⛈️"], 99: ["Thunderstorm", "⛈️", "⛈️"]
  };
  const info = (c) => CODES[c] || ["—", "·", "·"];
  const r = Math.round;

  function load() {
    fetch(URL_API)
      .then((res) => { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then((d) => {
        const c = d.current, day = d.daily;
        const [label, dIcon, nIcon] = info(c.weather_code);
        document.getElementById("icon").textContent = c.is_day ? dIcon : nIcon;
        document.getElementById("temp").textContent = r(c.temperature_2m) + "°F";
        document.getElementById("cond").textContent = label + " · Feels like " + r(c.apparent_temperature) + "°";
        document.getElementById("sub").textContent =
          "H " + r(day.temperature_2m_max[0]) + "° / L " + r(day.temperature_2m_min[0]) + "°  ·  " +
          "Wind " + r(c.wind_speed_10m) + " mph  ·  Humidity " + c.relative_humidity_2m + "%  ·  " +
          "Rain " + (day.precipitation_probability_max[0] ?? 0) + "%";
        let html = "";
        for (let i = 1; i < day.time.length; i++) {
          const name = new Date(day.time[i] + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" });
          html += '<div class="day"><b>' + name + '</b><span class="di">' + info(day.weather_code[i])[1] +
            "</span>" + r(day.temperature_2m_max[i]) + "° <span>" + r(day.temperature_2m_min[i]) + "°</span></div>";
        }
        document.getElementById("days").innerHTML = html;
      })
      .catch(() => {
        document.getElementById("cond").innerHTML = '<span class="err">Weather unavailable right now</span>';
      });
  }
  load();
  setInterval(load, 15 * 60 * 1000);
</script>
</body>
</html>
